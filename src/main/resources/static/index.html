<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 TechLab Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light container py-5">

<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
  <h1 class="display-6">📦 TechLab Store</h1>
  <div>
    <button class="btn btn-warning position-relative me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas">
      🛒 Carrito
      <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        0
      </span>
    </button>
    <button class="btn btn-success" onclick="abrirModalCrear()">+ Nuevo Producto</button>
  </div>
</div>

<div class="card bg-white p-3 mb-4 shadow-sm">
  <div class="row g-2">
    <div class="col-md-5">
      <input type="text" id="busquedaNombre" class="form-control" placeholder="🔎 Buscar por nombre...">
    </div>
    <div class="col-md-4">
      <input type="text" id="busquedaCategoria" class="form-control" placeholder="📂 Buscar por categoría...">
    </div>
    <div class="col-md-3 d-flex gap-2">
      <button class="btn btn-primary w-100" onclick="buscarProductos()">Buscar</button>
      <button class="btn btn-outline-secondary" onclick="limpiarFiltros()">❌</button>
    </div>
  </div>
</div>

<div id="lista-productos" class="row g-3">
</div>

<div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tituloModal">Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="prodId">
        <div class="mb-2">
          <label>Nombre:</label>
          <input type="text" class="form-control" id="prodNombre">
        </div>
        <div class="mb-2">
          <label>Categoría:</label>
          <input type="text" class="form-control" id="prodCategoria">
        </div>
        <div class="mb-2">
          <label>Precio:</label>
          <input type="number" class="form-control" id="prodPrecio">
        </div>
        <div class="mb-2">
          <label>Stock:</label>
          <input type="number" class="form-control" id="prodStock">
        </div>
        <div class="mb-2">
          <label>Imagen URL:</label>
          <input type="text" class="form-control" id="prodImg" placeholder="http://...">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="guardarProducto()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas">
  <div class="offcanvas-header bg-warning">
    <h5 class="offcanvas-title">🛒 Tu Carrito</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column">
    <div id="items-carrito" class="flex-grow-1 overflow-auto mb-3">
      <p class="text-center text-muted mt-5">El carrito está vacío</p>
    </div>

    <div class="border-top pt-3 bg-light p-3 rounded">
      <div class="d-flex justify-content-between mb-2">
        <strong>Total a Pagar:</strong>
        <strong class="text-success fs-5" id="total-carrito">$0.00</strong>
      </div>
      <button class="btn btn-dark w-100 py-2" onclick="finalizarCompra()">✅ Finalizar Compra</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
